name: Deploy Tic-Tac-Toe to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14

      - name: Verify Emscripten version
        run: emcc -v

      - name: Compile C++ to WebAssembly
        run: |
          emcc game.cpp -o game.js \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS='["_reset_game", "_make_move", "_get_game_state_json"]' \
            -s EXPORTED_RUNTIME_METHODS='["UTF8ToString", "cwrap", "ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -O3

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
